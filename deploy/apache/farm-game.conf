<VirtualHost *:80>
    ServerName educs242.ai-startpoint.com
    ServerAlias www.educs242.ai-startpoint.com

    DocumentRoot "/var/www/farm-game-current"
    DirectoryIndex index.html

    <Directory "/var/www/farm-game-current">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /api/   http://127.0.0.1:3000/api/ retry=0 timeout=30
    ProxyPassReverse /api/   http://127.0.0.1:3000/api/
    ProxyPass        /health http://127.0.0.1:3000/health retry=0 timeout=10
    ProxyPassReverse /health http://127.0.0.1:3000/health

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    <LocationMatch "^/(Build|TemplateData)/">
        Header set Cache-Control "no-cache, must-revalidate"
    </LocationMatch>

    <FilesMatch "\.wasm\.br$">
        ForceType application/wasm
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
    </FilesMatch>

    <FilesMatch "\.js\.br$">
        ForceType application/javascript
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
    </FilesMatch>

    <FilesMatch "\.data\.br$">
        ForceType application/octet-stream
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog logs/farm-game-error.log
    CustomLog logs/farm-game-access.log combined
</VirtualHost>
